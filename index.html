<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lakeisha Caterers | Catering Services</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #170728;
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            padding-top: 65px; /* Offset for navbar */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(27, 7, 45, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 120, 0.18);
        }

        .brand {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand span {
            color: #e7ad2d;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #e7ad2d;
        }

        .menu-toggle {
            display: none;
            border: none;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        /* =========================
           HERO / FLYER SECTION
        ========================= */

        .hero {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 10px 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-img-wrap {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(231, 173, 45, 0.3);
        }

        .hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* =========================
           BOTTOM MESSAGE
        ========================= */

        .hero-bottom {
            margin-top: 15px;
            width: min(100%, 500px);
            padding: 10px 18px;
            border-radius: 40px;
            background: rgba(31, 8, 51, 0.95);
            border: 1px solid rgba(231, 173, 45, 0.7);
            color: white;
            font-size: 0.82rem;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .hero-bottom strong {
            color: #e7ad2d;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 18px 20px;
            text-align: center;
            background: #12051e;
            color: #aaa;
            font-size: 0.82rem;
            border-top: 1px solid rgba(231, 173, 45, 0.2);
            margin-top: auto;
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 750px) {

            .navbar {
                padding: 14px 5%;
            }

            .brand {
                font-size: 1.15rem;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 0;
                background: rgba(20, 5, 32, 0.98);
                border-top: 1px solid rgba(231, 173, 45, 0.2);
            }

            .nav-links.show {
                display: flex;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links a {
                display: block;
                padding: 15px;
            }

            .hero {
                padding: 10px 10px 15px;
            }

            .hero-bottom {
                font-size: 0.78rem;
                padding: 8px 12px;
                line-height: 1.3;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar">

        <a href="index.html" class="brand">
            Lakeisha <span>Caterers</span>
        </a>

        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open navigation"
        >
            ☰
        </button>

        <ul class="nav-links" id="navLinks">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="pages/about.html">About</a>
            </li>

            <li>
                <a href="pages/services.html">Services</a>
            </li>

            <li>
                <a href="pages/gallery.html">Gallery</a>
            </li>

            <li>
                <a href="pages/contact.html">Contact</a>
            </li>

        </ul>

    </nav>

    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero">

            <div class="hero-img-wrap">
                <img
                    src="assets/images/hero/hero.jpg"
                    alt="Lakeisha Catering Services Flyer"
                    class="hero-img"
                >
            </div>

            <div class="hero-bottom">
                <strong>Lakeisha Caterers</strong>
                — Quality services, food is our priority.
            </div>

        </section>

    </main>

    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        © 2026 Lakeisha Caterers. All Rights Reserved.

    </footer>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const menuToggle =
            document.getElementById("menuToggle");

        const navLinks =
            document.getElementById("navLinks");

        menuToggle.addEventListener("click", function () {

            navLinks.classList.toggle("show");

        });

        document.querySelectorAll(".nav-links a")
            .forEach(function(link) {

                link.addEventListener("click", function() {

                    navLinks.classList.remove("show");

                });

            });

    </script>

</body>
</html>
